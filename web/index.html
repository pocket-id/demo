{{define "title"}}Demo{{end}}
{{define "content"}}
<h1 id="heading">Try Pocket ID</h1>
<p class="lede" id="intro">Try out Pocket ID before you install it. The instance and everything in it is deleted after {{.Duration}}.</p>
<p class="lede" id="starting" hidden>Your Pocket ID instance is starting up, which usually takes a few seconds.</p>
<p class="lede error" id="error" role="alert" hidden></p>
<div class="actions">
<button class="btn btn-primary" id="start" type="button"><span class="spinner" aria-hidden="true"></span>Start the demo</button>
<a class="btn btn-quiet" href="https://pocket-id.org/docs/setup/installation">Install Pocket ID</a>
</div>
<script>
const heading = document.getElementById("heading");
const intro = document.getElementById("intro");
const starting = document.getElementById("starting");
const error = document.getElementById("error");
const start = document.getElementById("start");

function show(state, message) {
	heading.textContent = state === "starting" ? "Starting your demo" : "Try Pocket ID";
	intro.hidden = state !== "idle";
	starting.hidden = state !== "starting";
	error.hidden = state !== "error";
	error.textContent = message || "The demo couldn't be started. Please try again later.";
	start.disabled = state === "starting";
	start.setAttribute("aria-busy", state === "starting");
}

start.addEventListener("click", async () => {
	show("starting");
	try {
		const res = await fetch("/start", { method: "POST" });
		const body = await res.json();
		if (body.url) {
			location.href = body.url;
			return;
		}
		show("error", body.error);
	} catch {
		show("error");
	}
});

// Going back to this page from the demo restores it from the cache in its starting state
addEventListener("pageshow", (e) => e.persisted && show("idle"));
</script>
{{end}}
