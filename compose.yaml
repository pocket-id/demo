services:
  demo:
    image: ghcr.io/pocket-id/demo
    build: .
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      BASE_URL: http://localhost:8080
      # TRUST_PROXY: "true"
    networks:
      - default
      - demo

networks:
  # Sessions join this network by name and have no internet access on it
  demo:
    name: pocket-id-demo
    internal: true
